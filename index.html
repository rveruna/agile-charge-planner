<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agile Charge Planner: the cheapest half-hours to charge an EV</title>
    <meta
      name="description"
      content="Pick a region and how long you need to charge, and see the cheapest half-hour slots on Agile Octopus, with a chart and an accessible table."
    />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      // Apply a saved light theme before first paint, so a light-theme visitor never sees a dark flash
      try {
        if (localStorage.getItem('agile-charge-planner-theme') === 'light')
          document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
